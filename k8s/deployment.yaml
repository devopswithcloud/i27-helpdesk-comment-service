apiVersion: apps/v1
kind: Deployment
metadata:
  name: i27-comment
  labels:
    app: i27-comment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i27-comment
  template:
    metadata:
      labels:
        app: i27-comment
    spec:
      containers:
        - name: i27-comment
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: ${SECRET_NAME}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
